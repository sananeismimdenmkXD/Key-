<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requireman038 - Hızlı Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #0f0f13;
            border: 2px solid #7800ff;
            border-radius: 14px;
            padding: 25px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 25px rgba(120, 0, 255, 0.3);
        }

        h2 {
            color: #00ff78;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .stage-title {
            color: #a0a0b0;
            font-size: 13px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-box {
            background: #181820;
            border: 1px solid #323246;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #20202c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
            text-align: center;
        }

        button {
            background: #7800ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #6000cc;
        }

        .key-container {
            display: none;
        }

        .key-box {
            background: #20202c;
            border: 1px solid #00ff78;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            color: #00ff78;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: -8px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- TEST EKRANI -->
        <div id="testScreen">
            <h2>Requireman038 Doğrulama</h2>
            <div class="stage-title" id="stageIndicator">Soru 1 / 2</div>
            
            <div class="question-box" id="questionText">Yükleniyor...</div>
            
            <input type="text" id="answerInput" placeholder="Cevabınızı yazın...">
            <div class="error-msg" id="errorMsg">Yanlış cevap, tekrar dene!</div>
            
            <button onclick="checkAnswer()">Cevapla & İlerle</button>
        </div>

        <!-- BAŞARILI / KEY EKRANI -->
        <div class="key-container" id="keyScreen">
            <h2>Tebrikler!</h2>
            <p style="color: #a0a0b0; font-size: 13px; margin-bottom: 15px;">Doğrulama başarılı, anahtarın aşağıdadır:</p>
            
            <div class="key-box" id="keyText">requireL0CAL038</div>
            
            <button onclick="copyKey()">Key'i Kopyala</button>
            <div id="statusMsg" style="color: #00ff78; font-size: 13px; margin-top: 10px; display: none;">✔ Key panoya kopyalandı!</div>
        </div>
    </div>

    <script>
        // Sadece 2 Soru
        const questions = [
            {q: "Beşiktaş futbol takımının renkleri nedir? (Araya / koyarak yaz)", a: "siyah/beyaz"},
            {q: "Gündüzleri görünmeyen, geceleri davet edilmeden gelen şey nedir?", a: "yıldız"}
        ];

        let currentIndex = 0;

        function loadQuestion() {
            if (currentIndex < questions.length) {
                document.getElementById("questionText").innerText = questions[currentIndex].q;
                document.getElementById("stageIndicator").innerText = `Soru ${currentIndex + 1} / 2`;
                document.getElementById("answerInput").value = "";
                document.getElementById("errorMsg").style.display = "none";
            } else {
                document.getElementById("testScreen").style.display = "none";
                document.getElementById("keyScreen").style.display = "block";
            }
        }

        function checkAnswer() {
            let userAns = document.getElementById("answerInput").value.trim().toLowerCase();
            let correctAns = questions[currentIndex].a;

            if (userAns === correctAns) {
                currentIndex++;
                loadQuestion();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        document.getElementById("answerInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        function copyKey() {
            var key = document.getElementById("keyText").innerText;
            navigator.clipboard.writeText(key).then(function() {
                var status = document.getElementById("statusMsg");
                status.style.display = "block";
                setTimeout(function() {
                    status.style.display = "none";
                }, 3000);
            });
        }

        loadQuestion();
    </script>
</body>
</html>
